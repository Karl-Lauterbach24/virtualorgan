{% extends "base.html" %}
{% block content %}
<div class="grid">
  <div class="card">
    <h2>Allgemein</h2>
    <form method="post">
      <label><input type="checkbox" name="require_login" value="1" {% if settings.require_login=='1' %}checked{% endif %}> Login zum Zugriff auf die Weboberfläche erforderlich</label>
      <label><input type="checkbox" name="kiosk_enabled" value="1" {% if settings.kiosk_enabled=='1' %}checked{% endif %}> Kiosk-Modus auf HDMI (Vollbild-Weboberfläche)</label>
      <label>Hostname</label>
      <input type="text" name="hostname" value="{{ hostname }}">
      <label>Standard-Ausgabe</label>
      <select name="output_device">
        {% for o in outputs %}<option value="{{ o.id }}" {% if o.id==settings.output_device %}selected{% endif %}>{{ o.label }}</option>{% endfor %}
      </select>
      <label>Lautstärke / Gain ({{ settings.gain }})</label>
      <input type="range" name="gain" min="0" max="1" step="0.05" value="{{ settings.gain }}">
      <label><input type="checkbox" name="reverb" value="1" {% if settings.reverb=='1' %}checked{% endif %}> Hall (Reverb)</label>
      <label><input type="checkbox" name="chorus" value="1" {% if settings.chorus=='1' %}checked{% endif %}> Chorus</label>
      <button type="submit">Speichern</button>
    </form>
  </div>

  <div class="card">
    <h2>Benutzer</h2>
    <table class="filelist">
      <thead><tr><th>Name</th><th>Rolle</th><th></th></tr></thead>
      <tbody>
      {% for u in users %}
      <tr>
        <td>{{ u.username }}</td><td>{{ u.role }}</td>
        <td class="actions">
          <form method="post" action="{{ url_for('manage_users') }}" style="display:inline-flex;gap:4px;align-items:center">
            <input type="hidden" name="action" value="password">
            <input type="hidden" name="uid" value="{{ u.id }}">
            <input type="password" name="password" placeholder="neues Passwort" style="width:140px;margin:0">
            <button type="submit" title="Passwort setzen">🔑</button>
          </form>
          <form method="post" action="{{ url_for('manage_users') }}" style="display:inline">
            <input type="hidden" name="action" value="delete">
            <input type="hidden" name="uid" value="{{ u.id }}">
            <button type="submit" title="Benutzer löschen">🗑</button>
          </form>
        </td>
      </tr>
      {% endfor %}
      </tbody>
    </table>
    <h3>Benutzer hinzufügen</h3>
    <form method="post" action="{{ url_for('manage_users') }}">
      <input type="hidden" name="action" value="add">
      <label>Benutzername</label>
      <input type="text" name="username" required>
      <label>Passwort</label>
      <input type="password" name="password" required>
      <label>Rolle</label>
      <select name="role"><option value="user">Benutzer</option><option value="admin">Administrator</option></select>
      <button type="submit">Hinzufügen</button>
    </form>
  </div>
</div>
{% endblock %}
