{% extends "base.html" %}
{% block content %}
<div class="card center-card">
  <h2>Anmelden</h2>
  <form method="post">
    <label>Benutzername</label>
    <input type="text" name="username" autofocus required>
    <label>Passwort</label>
    <input type="password" name="password" required>
    <button type="submit">Anmelden</button>
  </form>
</div>
{% endblock %}
