{% extends "base.html" %}
{% block content %}
<div class="grid">
  <div class="card">
    <h2>Hochladen</h2>
    <form id="uploadForm" method="post" action="{{ url_for('upload') }}" enctype="multipart/form-data">
      <label>Ablage</label>
      <select name="scope">
        <option value="shared">Gemeinsam</option>
        {% if current_user.is_authenticated %}<option value="personal">Persönlich</option>{% endif %}
      </select>
      <label>Ordner (optional)</label>
      <input type="text" name="folder" placeholder="z.B. Weihnachten">
      <input type="file" name="files" multiple accept=".mid,.midi,.kar,.musicxml,.mxl,.xml">
      <button type="submit">Hochladen</button>
    </form>
  </div>

  <div class="card">
    <h2>Aktive Stimmen</h2>
    <div id="visualizer"></div>
  </div>
</div>

<div class="card">
  <h2>Gemeinsame Bibliothek</h2>
  <div class="libbrowser" data-scope="shared" data-files='{{ shared|tojson }}'></div>
</div>
{% if current_user.is_authenticated %}
<div class="card">
  <h2>Meine Dateien</h2>
  <div class="libbrowser" data-scope="personal" data-files='{{ personal|tojson }}'></div>
</div>
{% endif %}
{% endblock %}
